version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frnd_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/frnd_app
      - JWT_SECRET=frnd_production_jwt_secret_change_me
      - CORS_ORIGIN=*
    depends_on:
      - mongo
    networks:
      - frnd_network

  mongo:
    image: mongo:7.0
    container_name: frnd_mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - frnd_network

volumes:
  mongo_data:
    driver: local

networks:
  frnd_network:
    driver: bridge
